spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/demo_db?useSSL=false&serverTimezone=UTC
# Chạy local: tạo database demo_db trong MySQL, rồi sửa username/password bên dưới cho máy của bạn.
# Chạy backend từ thư mục demo: .\mvnw.cmd spring-boot:run
spring.datasource.username=root
spring.datasource.password=123456

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Local development: Hibernate tự thêm bảng/cột mới khi chạy ứng dụng.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Ngày lễ theo định dạng yyyy-MM-dd, cách nhau bằng dấu phẩy. Để trống = không có ngày lễ.
# Ví dụ: app.holidays=2026-01-01,2026-04-30
# Cập nhật danh sách này khi sang năm mới; ngày lễ trùng cuối tuần được tính hệ số 300%.
app.holidays=

jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
jwt.expiration=3600000
